<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курс Опермен. Тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEEEEC;
  --card: #FFFFFF;
  --ink: #1F1F1F;
  --muted: #5C5C5C;
  --line: #CFCFCB;
  --accent: #D42A1F;
  --ok: #1B7A3E;
  --ok-bg: #E2F2E8;
  --bad: #B3261E;
  --bad-bg: #FBE6E4;
  --mark: #F7D2CD;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161616;
    --card: #222222;
    --ink: #EDEDEB;
    --muted: #A9A9A5;
    --line: #3B3B3B;
    --accent: #FF5B4D;
    --ok: #6FD497;
    --ok-bg: #15301E;
    --bad: #FF8A80;
    --bad-bg: #3A1D1B;
    --mark: #5C2420;
  }
}
:root[data-theme="dark"] {
  --paper: #161616;
  --card: #222222;
  --ink: #EDEDEB;
  --muted: #A9A9A5;
  --line: #3B3B3B;
  --accent: #FF5B4D;
  --ok: #6FD497;
  --ok-bg: #15301E;
  --bad: #FF8A80;
  --bad-bg: #3A1D1B;
  --mark: #5C2420;
}
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'PT Serif', Georgia, 'Times New Roman', serif;
  font-size: 18px;
  line-height: 1.55;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 56px; }

.mast { border-top: 8px solid var(--ink); border-bottom: 3px solid var(--accent); padding: 14px 0 12px; margin-bottom: 18px; }
.mast-title {
  margin: 0;
  font-family: 'Oswald', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 700;
  font-size: clamp(38px, 11vw, 60px);
  line-height: 1;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.mast-sub { margin: 8px 0 0; color: var(--muted); font-size: 16px; }

.prog { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar { height: 100%; background: var(--accent); transition: width .3s ease; }
.count { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
.resume { margin: 4px 0 0; font-size: 15px; color: var(--muted); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 20px 18px; margin-top: 18px; }
.kind { margin: 0 0 6px; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; font-size: 17px; color: var(--accent); }
.q { margin: 0 0 14px; font-size: 21px; line-height: 1.35; font-weight: 700; }
.lead { margin: 0 0 14px; }

.opt {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  width: 100%; min-height: 54px; margin-top: 10px; padding: 12px 14px;
  text-align: left; font: inherit; font-size: 17px; line-height: 1.4;
  color: var(--ink); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 6px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.dim { opacity: .65; }
.tag { flex: none; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; font-size: 14px; }
.correct .tag { color: var(--ok); }
.wrong .tag { color: var(--bad); }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.fb { margin-top: 16px; padding: 12px 14px; border-left: 5px solid var(--line); border-radius: 4px; background: var(--paper); }
.fb.ok { border-left-color: var(--ok); background: var(--ok-bg); }
.fb.bad { border-left-color: var(--bad); background: var(--bad-bg); }

.primary {
  display: block; width: 100%; min-height: 54px; margin-top: 16px; padding: 12px 18px;
  font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; font-size: 20px; letter-spacing: .02em;
  color: var(--paper); background: var(--ink); border: 0; border-radius: 6px; cursor: pointer;
}
.primary:disabled { opacity: .35; cursor: not-allowed; }
.linklike { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 15px; color: var(--accent); text-decoration: underline; cursor: pointer; }

.row { margin-top: 16px; }
.row label { display: block; margin-bottom: 6px; }
select, textarea {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 6px;
}
select { min-height: 50px; padding: 0 10px; }
textarea { min-height: 92px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
.row.ok select { border-color: var(--ok); }
.row.bad select { border-color: var(--bad); }
.rowfb { margin-top: 4px; font-size: 16px; }
.row.ok .rowfb { color: var(--ok); }
.row.bad .rowfb { color: var(--bad); }

.field { margin-top: 18px; }
.field strong { display: block; }
.hint { display: block; color: var(--muted); font-size: 15px; margin-bottom: 6px; }

.model { margin-top: 20px; padding-left: 14px; border-left: 4px solid var(--accent); }
.model h3 { margin: 0 0 8px; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; font-size: 20px; }
.model p { margin: 0 0 10px; }
fieldset { margin: 20px 0 0; padding: 0; border: 0; }
legend { padding: 0; margin-bottom: 6px; font-weight: 700; }
.check { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 8px 0; cursor: pointer; }
.check input { flex: none; width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--accent); }

.score { margin: 0; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 76px; line-height: 1; }
.score small { font-size: 28px; font-weight: 500; color: var(--muted); }
.pct { margin: 4px 0 12px; color: var(--muted); }
.parts { margin: 16px 0 0; padding: 0; list-style: none; }
.parts li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.parts li:last-child { border-bottom: 1px solid var(--line); }
.todo { margin: 6px 0 0; padding-left: 22px; }
.note { margin-top: 18px; color: var(--muted); font-size: 15px; }

.back { display: inline-block; margin: 12px 0 6px; }
.secondary {
  display: block; width: 100%; min-height: 54px; margin-top: 10px; padding: 12px 18px;
  font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; font-size: 20px; letter-spacing: .02em;
  color: var(--ink); background: transparent; border: 1.5px solid var(--ink); border-radius: 6px; cursor: pointer;
}
.mods { margin-top: 4px; }
.mod {
  display: flex; align-items: center; gap: 16px; width: 100%; min-height: 76px; margin-top: 10px; padding: 14px 16px;
  text-align: left; font: inherit; color: var(--ink); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 6px; cursor: pointer;
}
.mod:hover:not(:disabled) { border-color: var(--ink); }
.mod:disabled { cursor: default; opacity: .55; }
.mod-n { flex: none; width: 40px; text-align: center; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 40px; line-height: 1; color: var(--accent); }
.mod:disabled .mod-n { color: var(--muted); }
.mod-body { display: flex; flex-direction: column; gap: 2px; }
.mod-title { font-weight: 700; font-size: 18px; line-height: 1.3; }
.mod-status { font-size: 15px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
@media (min-width: 700px) { body { font-size: 19px; } .card { padding: 26px 26px; } }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; padding-top: 6px; }
.topbar .back { margin: 0; }
.hide { visibility: hidden; }
.iconbtn {
  flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
  color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; cursor: pointer;
}
.iconbtn:hover { border-color: var(--ink); }
.iconbtn svg { width: 22px; height: 22px; }
.sec-title {
  margin: 28px 0 0; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500;
  font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.mod-ic { flex: none; width: 40px; display: grid; place-items: center; color: var(--accent); }
.mod-ic svg { width: 30px; height: 30px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip {
  position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px;
  font-size: 16px; border: 1.5px solid var(--line); border-radius: 22px; background: var(--card); cursor: pointer;
}
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip:has(input:checked) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.grp { margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--line); }
.grp:first-of-type { border-top: 0; }
.check.master span { font-weight: 700; }
.check.sub { padding-left: 34px; }
.cnt { color: var(--muted); font-size: 15px; white-space: nowrap; }
.check span.t { flex: 1; }
.soon { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.startbar {
  position: sticky; bottom: 0; z-index: 2; margin: 18px -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--paper); border-top: 1px solid var(--line);
}
.startbar .primary { margin-top: 6px; }
.selcount { margin: 0; font-size: 16px; color: var(--muted); }
.vid { display: inline-block; margin-top: 8px; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; font-size: 16px; color: var(--accent); }
.opt.sel { border-color: var(--ink); background: var(--paper); box-shadow: inset 4px 0 0 var(--accent); }
.exbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 8px; }
.exbar span { color: var(--muted); font-size: 15px; }
.timer { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; color: var(--ink) !important; }
.timer.low { color: var(--bad) !important; }
.rev { padding: 14px 0; border-top: 1px solid var(--line); }
.rev h3 { margin: 0 0 6px; font-size: 17px; line-height: 1.4; }
.rev p { margin: 4px 0 0; font-size: 16px; }
.st-ok { color: var(--ok); font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; }
.st-bad { color: var(--bad); font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; }
.muted { color: var(--muted); }
.flash { width: 100%; margin-top: 18px; text-align: center; font: inherit; color: var(--ink); cursor: pointer; }
.flash .ft { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 30px; line-height: 1.15; }
.flash .fd { font-size: 19px; line-height: 1.5; }
.flash .fh { color: var(--muted); font-size: 15px; }
.duo { display: flex; gap: 10px; }
.duo > * { flex: 1; font-size: 18px; padding-left: 10px; padding-right: 10px; }
.big2 { display: flex; gap: 24px; flex-wrap: wrap; }
.big2 div { flex: 1; min-width: 120px; }
.big2 b { display: block; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 44px; line-height: 1; }
.big2 span { color: var(--muted); font-size: 15px; }
.mrow { padding: 12px 0; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.mrow .top { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 17px; }
.mrow .sub { color: var(--muted); font-size: 15px; }
.mbar { height: 6px; margin-top: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--accent); }

/* ---------- Отметка «сложный» ---------- */
.q:has(+ .flagbtn) { margin-bottom: 8px; }
.flagbtn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; margin: 0 0 14px; padding: 4px 14px 4px 10px;
  font: inherit; font-size: 15px; line-height: 1.2; color: var(--muted); background: none;
  border: 1.5px solid var(--line); border-radius: 18px; cursor: pointer;
}
.flagbtn svg { width: 18px; height: 18px; flex: none; }
.flagbtn:hover { border-color: var(--ink); color: var(--ink); }
.flagbtn.on { color: var(--accent); border-color: var(--accent); background: var(--mark); }
.flagbtn.on svg path { fill: currentColor; }
.rev .flagbtn { margin: 6px 0 0; }
@media (prefers-reduced-motion: no-preference) {
  .flagbtn { transition: color .15s, border-color .15s, background-color .15s, transform .12s; }
  .flagbtn.bump svg { animation: pop .35s ease; }
  .flagbtn:active { transform: scale(.96); }
}

/* ---------- Сегодня ---------- */
.today { margin-top: 4px; }
.tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.tgrid > div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tgrid b { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 30px; line-height: 1; }
.tgrid span { color: var(--muted); font-size: 14px; line-height: 1.25; }
.ring {
  --p: 0; position: relative; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0);
}
.ring::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--card); }
.ring b { position: relative; font-size: 22px; }
.flame { display: flex; align-items: center; height: 64px; gap: 2px; }
.flame svg { width: 26px; height: 26px; color: var(--accent); }
.flame.off svg { color: var(--line); }
.gauge { display: grid; place-items: center; height: 64px; }
.today .note { margin-top: 12px; text-align: center; }

/* ---------- Заметки и инструменты вопроса ---------- */
.qtools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.qtools .flagbtn { margin: 0; }
.q:has(+ .qtools) { margin-bottom: 8px; }
.notebtn.on { color: var(--ink); border-color: var(--ink); background: var(--paper); }
.notebox { margin: -4px 0 14px; }
.notebox textarea { min-height: 72px; font-size: 16px; }
.notebox .hint { margin: 4px 0 0; min-height: 1em; }
.notelist .rev h3 { font-size: 16px; }

/* ---------- Термины в тексте ---------- */
.termlink {
  display: inline; padding: 0; font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
  text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px;
}
.termlink:hover { color: var(--accent); }
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); }
.sheet {
  width: 100%; max-width: 680px; max-height: 80vh; overflow: auto; padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--card); color: var(--ink); border-radius: 14px 14px 0 0;
}
.sheet p { margin: 0 0 12px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet-wrap { animation: fadeIn .2s ease both; }
  .sheet { animation: sheetUp .28s cubic-bezier(.2,.7,.2,1) both; }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.gtasks { margin-top: 8px; }

/* ---------- Клавиатура ---------- */
.opt .ot { flex: 1; }
.kbd { display: none; }
@media (hover: hover) and (pointer: fine) {
  .kbd {
    display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif;
    font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
  }
  .opt:disabled .kbd { display: none; }
}
.kbhint { display: none; }
@media (hover: hover) and (pointer: fine) { .kbhint { display: block; } }

/* ---------- Ситуация с ветвлением ---------- */
.bstep { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.bstep:first-child { border-top: 0; padding-top: 0; }
.bsit { margin: 0 0 4px; font-weight: 700; }
.opt.mid { border-color: var(--ink); background: var(--paper); }
.fb.mid { border-left-color: var(--ink); }

/* ---------- Claude ---------- */
.aibox { margin-top: 12px; }
.aibtn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; font: inherit; font-size: 16px;
  color: var(--ink); background: var(--card); border: 1.5px dashed var(--accent); border-radius: 22px; cursor: pointer;
}
.aibtn svg { width: 18px; height: 18px; color: var(--accent); }
.aibtn[hidden] { display: none; }
.aiout:not(:empty) { margin-top: 10px; padding: 12px 14px; border-left: 4px solid var(--accent); border-radius: 4px; background: var(--paper); white-space: pre-wrap; font-size: 17px; }
.aiout .muted { font-style: italic; }
.aistop { margin-left: 8px; }

/* ---------- Настройки ---------- */
.setrow { margin-top: 6px; }
.codebox { width: 100%; min-height: 90px; margin-top: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
.okmsg { color: var(--ok); }
.errmsg { color: var(--bad); }
:root[data-fs="l"] .wrap, :root[data-fs="l"] .sheet { zoom: 1.12; }
:root[data-fs="xl"] .wrap, :root[data-fs="xl"] .sheet { zoom: 1.25; }

/* ---------- Доступ и кабинет ---------- */
body.gated #searchBtn, body.gated #setBtn { display: none; }
.codein {
  width: 100%; min-height: 54px; margin-top: 6px; padding: 10px 14px; font: inherit; font-size: 20px; letter-spacing: .06em;
  color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 6px;
}
.codein:focus { border-color: var(--ink); outline: none; }
.adm { padding: 16px; }
.adm.off { opacity: .6; }
.adm-top { display: flex; justify-content: space-between; gap: 12px; font-size: 18px; }
.adm-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.adm-acts .flagbtn { margin: 0; color: var(--ink); }
.adm-acts select { min-height: 0; width: auto; padding: 2px 4px; font-size: 15px; border: 0; background: none; }
.devlist { margin: 8px 0 0; padding-left: 20px; font-size: 15px; }

/* ---------- Нижняя панель и темы ---------- */
.tabbar {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 0 8px env(safe-area-inset-bottom, 0px); background: var(--card); border-top: 1px solid var(--line);
}
body.has-tabbar .tabbar { display: block; }
body.gated .tabbar { display: none !important; }
body.has-tabbar .wrap { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
.tabbar-in { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 680px; margin: 0 auto; }
.tab {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 60px; padding: 6px 4px; border: 0; background: none; color: var(--muted); cursor: pointer;
  font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-weight: 500; font-size: 12px; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap;
}
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }
.tab.on::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
@media (prefers-reduced-motion: no-preference) {
  .tab { transition: color .15s, transform .12s; }
  .tab:active { transform: scale(.94); }
  .tab.on svg { animation: pop .3s ease; }
}

.tmod { margin-top: 12px; overflow: hidden; background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; }
.tmod.off { opacity: .55; }
.tmod-h {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 14px 16px;
  font: inherit; color: var(--ink); text-align: left; background: none; border: 0; cursor: pointer;
}
.tmod-h .mod-body { flex: 1; }
.chev { flex: none; color: var(--muted); }
.chev svg { width: 22px; height: 22px; display: block; }
.tmod.open .chev svg { transform: rotate(180deg); }
.tmod-b { padding: 0 16px 10px; border-top: 1px solid var(--line); }
.tmod-all { margin-top: 12px; }

  /* ---------- Результат ---------- */
  function partOf(c) {

  function showResult() {
    state.finished = true; save();

    var pct = TOTAL ? Math.round(got / TOTAL * 100) : 0;
    var what = S.kind === 'module' ? 'Модуль усвоен, можно переходить к следующему.' : 'Материал усвоен.';
    var verdict = pct >= 85 ? 'Отлично. ' + what
      : pct >= 60 ? 'Хорошо, но есть что повторить. Список ниже.'
      : (S.kind === 'module' ? 'Стоит пересмотреть видео модуля и пройти тренажёр ещё раз.' : 'Стоит пересмотреть видео по темам из списка и пройти ещё раз.');
    var parts = [], byPart = {};
    cards.forEach(function (c) {
      var p = partOf(c);
      if (!byPart[p]) { byPart[p] = [0, 0]; parts.push(p); }
      byPart[p][0] += state.results[c.uid] || 0;
      byPart[p][1] += maxPts(c);
    });
    var todo = [];
    cards.forEach(function (c) {
      if ((state.results[c.uid] || 0) < maxPts(c)) todo.push((S.kind === 'module' ? '' : 'М' + c.mod.n + '. ') + c.topic + vidHtml(c));
    });
    if (S.kind === 'errors') {
      var fixed = cards.filter(function (c) { return (state.results[c.uid] || 0) === maxPts(c); }).length;
      verdict = fixed === cards.length ? 'Все ошибки исправлены.' : 'Исправлено ' + fixed + ' из ' + nTasks(cards.length) + '. Оставшиеся задания снова попадут в работу над ошибками.';
    }
    setBack(true);
    app.innerHTML = mast(S.sub + '. Итог') +
      '<section class="card"><p class="score">' + got + ' <small>из ' + TOTAL + '</small></p>' +

      '<ul class="parts">' + parts.map(function (p) {

      (S.kind === 'custom' ? '<button class="secondary" id="repick" type="button">Собрать другой набор</button>' : '') +
      (S.kind === 'flagged' && cards.some(function (c) { return isFlag(c) && (state.results[c.uid] || 0) === maxPts(c); })

  /* Темы */
  function topicSession() {
    var st = stOf('topic');
    return { key: 'topic', kind: 'topic', sub: 'Модуль ' + (st.n || '') + '. ' + (st.title || ''),
      cards: (st.order || []).map(function (u) { return BY_UID[u]; }).filter(Boolean) };

  function startTopic(m, t) {
    var st = store.topic;

      var s = topicSession(), d = doneCount(s);
      if (d > 0 && d < s.cards.length) { openSession(s); return; }
    }
    store.topic = { results: {}, finished: false, mod: m.id, n: m.n, title: t,
      order: m.cards.filter(function (c) { return c.topic === t; }).map(function (c) { return c.uid; }) };
    save(); openSession(topicSession());
  }
  function topicsOf(m) {

    return { list: list, by: by };

  function examPts(c, a) {

  /* ---------- Словарь и поиск терминов ---------- */
  var glQuery = '';
  function norm(x) { return String(x).toLowerCase().replace(/ё/g, 'е'); }
  function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function hl(text, words) {
    if (!words.length) return esc(text);
    var n = norm(text), marks = [];
    words.forEach(function (w) {
      var from = 0, i;
      while ((i = n.indexOf(w, from)) > -1) { marks.push([i, i + w.length]); from = i + w.length; }
    });
    if (!marks.length) return esc(text);
    marks.sort(function (a, b) { return a[0] - b[0]; });
    var out = '', pos = 0;
    marks.forEach(function (m) {
      if (m[1] <= pos) return;
      var st = Math.max(m[0], pos);
      out += esc(text.slice(pos, st)) + '<mark>' + esc(text.slice(st, m[1])) + '</mark>';
      pos = m[1];
    });
    return out + esc(text.slice(pos));
  }
  function showGlossary() {
    S = null; setBack(true);
    var T = allTerms();
    app.innerHTML = mast('Словарь терминов') +
      '<div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>' +
      '<input type="search" id="gq" placeholder="Например, муда или ресурсы" aria-label="Поиск термина" autocomplete="off" enterkeyhint="search">' +
      '<button type="button" class="sclear" id="gclear" aria-label="Очистить поиск" hidden>×</button></div>' +
      '<p class="gcount" id="gcount" aria-live="polite"></p>' +

    var inp = $('gq');

    function draw() {
      glQuery = inp.value;

      $('gclear').hidden = !glQuery;
      var list = T.map(function (t) {
        var nt = norm(t.t), nd = norm(t.d), score = 0;
        for (var i = 0; i < words.length; i++) {
          var w = words[i];
          if (nt.indexOf(w) === 0) score += 3;
          else if (nt.indexOf(w) > -1) score += 2;
          else if (nd.indexOf(w) > -1) score += 1;
          else return null;
        }
        return { t: t, s: score };
      }).filter(Boolean);
      if (words.length) list.sort(function (a, b) { return b.s - a.s; });
      $('gcount').textContent = words.length
        ? (list.length ? 'Найдено: ' + list.length : 'Ничего не найдено')
        : 'Все термины: ' + T.length;
      $('gl').style.display = list.length ? '' : 'none';
      $('gl').innerHTML = list.map(function (o) {
        var t = o.t;

        var notes = tc.filter(function (c) { return noteOf(c.uid); });
        return '<div class="term"><span class="tm">Модуль ' + t.mod.n + '</span><h3>' + hl(t.t, words) + '</h3><p>' + hl(t.d, words) + '</p>' +
          notes.map(function (c) { return '<p class="muted" style="font-size:15px">Моя заметка: ' + esc(noteOf(c.uid)) + '</p>'; }).join('') +
          (tc.length ? '<button type="button" class="linklike gtasks" data-termtasks="' + esc(t.k) + '">Задания по термину · ' + tc.length + '</button>' : '') + '</div>';
      }).join('');
      if (words.length && !list.length) {
        $('gcount').innerHTML = 'Ничего не найдено. Попробуйте часть слова, например «потер» вместо «потерями».';
      }
    }
    var tmr = null;
    inp.addEventListener('input', function () { clearTimeout(tmr); tmr = setTimeout(draw, 120); });
    $('gclear').addEventListener('click', function () { inp.value = ''; draw(); inp.focus(); });
    $('gl').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-termtasks]') : null;

      if (t) startTerm(t);
    });
    draw();
    setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }, 50);
  }

  /* ---------- Интервальное повторение, дневная цель, готовность ---------- */
  var DAY = 86400000, SRS_STEPS = [1, 3, 7, 14];
  function dayKey(ts) {
    var d = new Date(ts || Date.now());
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function goalOf() { return (store.daily && store.daily.goal) || 10; }
  function doneToday() { return (store.daily && store.daily.days && store.daily.days[dayKey()]) || 0; }
  function streak() {
    var days = (store.daily && store.daily.days) || {}, g = goalOf(), n = 0, d = new Date();
    d.setHours(12, 0, 0, 0);
    if ((days[dayKey(d.getTime())] || 0) < g) d.setDate(d.getDate() - 1);
    while ((days[dayKey(d.getTime())] || 0) >= g) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function dueUids() {
    var R = store.srs || {}, now = Date.now();
    return ALL.filter(function (c) { return R[c.uid] && R[c.uid].due <= now; }).map(function (c) { return c.uid; });
  }

      '<p><button class="linklike" id="resetAllData" type="button">Удалить весь прогресс на этом устройстве</button></p>';

    Array.prototype.forEach.call(app.querySelectorAll('input[name=th]'), function (r) {
      r.addEventListener('change', function () {
        root.classList.add('theming');
        if (r.value === 'auto') { root.removeAttribute('data-theme'); try { localStorage.removeItem(THEME_KEY); } catch (e) {} }
        else { root.setAttribute('data-theme', r.value); try { localStorage.setItem(THEME_KEY, r.value); } catch (e) {} }

      });
    });
    Array.prototype.forEach.call(app.querySelectorAll('input[name=fs]'), function (r) {
      r.addEventListener('change', function () { applyFs(r.value); try { localStorage.setItem('opermen_fs', r.value); } catch (e) {} });
    });
    Array.prototype.forEach.call(app.querySelectorAll('input[name=goal]'), function (r) {
      r.addEventListener('change', function () { if (!store.daily) store.daily = { goal: 10, days: {} }; store.daily.goal = +r.value; save(); });
    });
    $('mkCode').addEventListener('click', function () {
      var code = exportCode();
      $('codeArea').innerHTML = '<textarea class="codebox" id="codeOut" readonly aria-label="Код прогресса"></textarea>' +
        '<button class="primary" id="cpCode" type="button">Скопировать код</button>';
      $('codeOut').value = code;
      $('cpCode').addEventListener('click', function () {
        var ta = $('codeOut'), btn = $('cpCode');
        function done(ok) { btn.textContent = ok ? 'Скопировано' : 'Выделите код и скопируйте вручную'; }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function () { done(true); }, function () {
          ta.select(); try { done(document.execCommand('copy')); } catch (e) { done(false); }
        });
        else { ta.select(); try { done(document.execCommand('copy')); } catch (e) { done(false); } }
      });
    });
    if ($('dlFile')) $('dlFile').addEventListener('click', function () {
      var json = JSON.stringify({ app: 'opermen', v: 1, at: Date.now(), store: store });
      DL.save({ filename: 'opermen-progress-' + dayKey() + '.json', data: json })
        .then(function () { $('dlMsg').textContent = 'Файл сохранён.'; })
        .catch(function (e) { $('dlMsg').textContent = e && e.code === 'declined' ? '' : 'Не удалось сохранить файл.'; });
    });
    var pending = null, armed = false;
    function setPending(st, msg) {
      pending = st; armed = false;
      $('impBtn').disabled = !st;
      $('impBtn').textContent = 'Загрузить из кода';
      $('impMsg').className = st ? '' : 'errmsg';
      $('impMsg').textContent = msg || '';
    }
    function tryParse(text) {
      try { var st = parseImport(text); setPending(st, ''); return true; }
      catch (e) { setPending(null, text.trim() ? 'Код не распознан. Проверьте, что он скопирован полностью.' : ''); return false; }
    }
    $('impCode').addEventListener('input', function () { tryParse($('impCode').value); });
    $('impFile').addEventListener('change', function () {
      var f = this.files && this.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { if (tryParse(String(rd.result))) { $('impCode').value = '(файл ' + f.name + ')'; $('impMsg').className = ''; $('impMsg').textContent = 'Файл прочитан. Нажмите «Загрузить», чтобы заменить прогресс.'; } };
      rd.readAsText(f);
    });
    $('impBtn').addEventListener('click', function () {
      if (!pending) return;
      if (!armed) { armed = true; $('impBtn').textContent = 'Текущий прогресс будет заменён. Нажмите ещё раз'; return; }
      store = pending; save(); TERM_CARDS = {};
      $('impMsg').className = 'okmsg'; $('impMsg').textContent = 'Прогресс загружен.';
      $('impBtn').disabled = true; $('impBtn').textContent = 'Готово';
    });
    var rArmed = false;
    $('resetAllData').addEventListener('click', function () {
      if (!rArmed) { rArmed = true; $('resetAllData').textContent = 'Удалить всё без возможности восстановить? Нажмите ещё раз'; return; }
      store = {}; save(); goMenu();
    });
  }

  /* ---------- Доступ по персональной ссылке (Supabase) ---------- */
  var CODE_KEY = 'opermen_code', DEV_KEY = 'opermen_device', OK_KEY = 'opermen_access_ok';
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function accessOn() { return !!(ACCESS.url && ACCESS.key); }
  function deviceId() {
    var d = lsGet(DEV_KEY);
    if (!d || d.length < 8) {
      d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
      lsSet(DEV_KEY, d);
    }
    return d;
  }
  function rpc(fn, args) {
    var h = { 'Content-Type': 'application/json', 'apikey': ACCESS.key };
    if (/^eyJ/.test(ACCESS.key)) h.Authorization = 'Bearer ' + ACCESS.key;
    return fetch(ACCESS.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: h, body: JSON.stringify(args) })
      .then(function (r) {
        return r.text().then(function (t) {
          var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
          if (!r.ok) { var err = new Error((d && d.message) || ('HTTP ' + r.status)); err.status = r.status; err.data = d; throw err; }
          return d;
        });
      });
  }
  function setGated(on) { document.body.classList.toggle('gated', !!on); }
  var studentName = '';

  function boot() {
    var params = new URLSearchParams(location.search);
    if (params.has('admin')) { setGated(true); showAdmin(); return; }
    if (!accessOn()) { showMenu(); return; }
    var code = params.get('k');
    if (code) {
      code = code.trim().toUpperCase();
      lsSet(CODE_KEY, code);
      params.delete('k');
      var qs = params.toString();
      try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash); } catch (e) {}
    } else code = lsGet(CODE_KEY);
    if (!code) { showGate('nocode'); return; }
    checkAccess(code);
  }

  function checkAccess(code) {
    setGated(true); setBack(false);
    app.innerHTML = mast('Тренажёр по операционному менеджменту') + '<p class="lead">Проверяем доступ…</p>';
    rpc('check_access', { p_code: code, p_device: deviceId(), p_ua: navigator.userAgent })
      .then(function (r) {
        if (r && r.ok) {
          studentName = r.student || '';
          lsSet(CODE_KEY, code);
          lsSet(OK_KEY, JSON.stringify({ code: code, at: Date.now(), student: studentName }));
          setGated(false); showMenu();
        } else {
          if (r && r.reason === 'invalid') lsDel(CODE_KEY);
          showGate((r && r.reason) || 'invalid', r);
        }
      })
      .catch(function (err) {
        var o = null; try { o = JSON.parse(lsGet(OK_KEY) || 'null'); } catch (e) {}
        if (!err.status && o && o.code === code && Date.now() - o.at < ACCESS.offlineDays * DAY) {
          studentName = o.student || ''; setGated(false); showMenu(); return;
        }
        showGate(err.status ? 'server' : 'network');
      });
  }

  function showGate(reason, r) {
    setGated(true); setBack(false);
    var msg = {
      nocode: 'Тренажёр открывается по персональной ссылке, которую выдаёт преподаватель. Откройте её или введите код вручную.',
      invalid: 'Код не найден. Проверьте ссылку или введите код ещё раз.',
      inactive: 'Доступ по этой ссылке отключён. Обратитесь к преподавателю.',
      limit: 'Эта ссылка уже используется на ' + ((r && r.max) || 2) + ' ' + plural((r && r.max) || 2, 'устройстве', 'устройствах', 'устройствах') + '. Если вы сменили телефон или очистили браузер, напишите преподавателю: он сбросит устройства.',
      network: 'Не удалось проверить доступ. Проверьте интернет и попробуйте ещё раз.',
      server: 'Сервис доступа сейчас не отвечает. Попробуйте позже или напишите преподавателю.'
    }[reason] || 'Нет доступа.';
    var retry = reason === 'network' || reason === 'server';
    app.innerHTML = mast('Тренажёр по операционному менеджменту') +
      '<section class="card"><h2 class="q">' + (retry ? 'Нет связи' : 'Нужна персональная ссылка') + '</h2><p class="lead">' + msg + '</p>' +
      (retry ? '<button class="primary" id="gRetry" type="button">Попробовать ещё раз</button>' : '') +
      '<label for="gCode" style="display:block;margin-top:18px;font-weight:700">Код доступа</label>' +
      '<input id="gCode" class="codein" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Например, A7F3K2QX" maxlength="20">' +
      '<button class="' + (retry ? 'secondary' : 'primary') + '" id="gGo" type="button" disabled>Войти</button></section>';
    var inp = $('gCode');
    inp.addEventListener('input', function () { $('gGo').disabled = inp.value.trim().length < 6; });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !$('gGo').disabled) $('gGo').click(); });
    $('gGo').addEventListener('click', function () { checkAccess(inp.value.trim().toUpperCase()); });
    if ($('gRetry')) $('gRetry').addEventListener('click', function () { boot(); });
  }

  function accessInfoHtml() {
    if (!accessOn()) return '';
    var code = lsGet(CODE_KEY) || '';
    return '<h2 class="sec-title">Доступ</h2><section class="card" style="margin-top:8px"><p style="margin:0">' +
      (studentName ? esc(studentName) + '<br>' : '') + '<span class="muted">Код ' + esc(code) + '</span></p>' +
      '<p class="note">Ссылка персональная и работает на ограниченном числе устройств. Не пересылайте её другим.</p></section>';
  }

  /* ---------- Страница преподавателя ---------- */
  var ADM_KEY = 'opermen_admin_pass';
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function uaShort(ua) {
    ua = ua || '';
    var os = /iPhone|iPad|iPod/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Устройство';
    var br = /YaBrowser/.test(ua) ? 'Яндекс Браузер' : /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox'
      : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
    return os + (br ? ' · ' + br : '');
  }
  function linkFor(code) { return location.origin + location.pathname + '?k=' + code; }
  function admErr(err) {
    if (err && (err.status === 401 || err.status === 403)) return 'Неверный пароль.';
    if (err && err.status === 404) return 'Функции не найдены. Проверьте, что SQL-скрипт выполнен в Supabase.';
    if (err && !err.status) return 'Нет связи с Supabase. Проверьте интернет и адрес проекта.';
    return 'Ошибка: ' + ((err && err.message) || 'неизвестная');
  }
  function copyText(text, btn, okLabel) {
    function done(ok) { if (btn) { var old = btn.textContent; btn.textContent = ok ? (okLabel || 'Скопировано') : 'Не получилось'; setTimeout(function () { btn.textContent = old; }, 1600); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    else {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { done(document.execCommand('copy')); } catch (e) { done(false); }
      document.body.removeChild(ta);
    }
  }
  function csvDownload(rows, name) {
    var csv = '\ufeff' + rows.map(function (r) { return r.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
  }

  function showAdmin() {
    setBack(false);
    if (!accessOn()) {
      app.innerHTML = mast('Кабинет преподавателя') + '<section class="card"><p style="margin:0">Сначала впишите адрес проекта и ключ Supabase в начало файла index.html (блок ACCESS).</p></section>';
      return;
    }
    var pass = ssGet(ADM_KEY);
    if (pass) { loadAdmin(pass); return; }
    app.innerHTML = mast('Кабинет преподавателя') +
      '<section class="card"><label for="aPass" style="display:block;font-weight:700">Пароль преподавателя</label>' +
      '<input id="aPass" class="codein" type="password" autocomplete="current-password">' +
      '<button class="primary" id="aGo" type="button">Войти</button><p id="aMsg" class="errmsg" aria-live="polite"></p></section>';
    function go() { var p = $('aPass').value; if (p) loadAdmin(p); }
    $('aGo').addEventListener('click', go);
    $('aPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    $('aPass').focus();
  }

  var admRows = [], admFilter = '';
  function loadAdmin(pass, keepScroll) {
    var y = window.scrollY;
    if (!keepScroll) app.innerHTML = mast('Кабинет преподавателя') + '<p class="lead">Загружаем…</p>';
    rpc('admin_list', { p_pass: pass }).then(function (rows) {
      ssSet(ADM_KEY, pass);
      admRows = rows || [];
      drawAdmin(pass);
      if (keepScroll) window.scrollTo(0, y);
    }).catch(function (err) {
      if (err && (err.status === 401 || err.status === 403)) { try { sessionStorage.removeItem(ADM_KEY); } catch (e) {} }
      showAdmin();
      if ($('aMsg')) $('aMsg').textContent = admErr(err);
    });
  }

  function drawAdmin(pass) {
    var now = Date.now();
    var devs = admRows.reduce(function (s, r) { return s + (+r.devices || 0); }, 0);
    var week = admRows.filter(function (r) { return r.last_seen && now - Date.parse(r.last_seen) < 7 * DAY; }).length;
    var full = admRows.filter(function (r) { return r.active && +r.devices >= r.max_devices; }).length;
    app.innerHTML = mast('Кабинет преподавателя') +
      '<section class="card"><div class="big2"><div><b>' + admRows.length + '</b><span>студентов</span></div><div><b>' + devs + '</b><span>устройств</span></div></div>' +
      '<div class="big2" style="margin-top:16px"><div><b>' + week + '</b><span>заходили за 7 дней</span></div><div><b>' + full + '</b><span>исчерпали лимит</span></div></div>' +
      '<button class="secondary" id="aRefresh" type="button">Обновить</button></section>' +

      '<h2 class="sec-title">Добавить студентов</h2><section class="card" style="margin-top:8px">' +
      '<label for="aNames" style="display:block;font-weight:700">Фамилии и имена, по одному в строке</label>' +
      '<textarea id="aNames" placeholder="Иванов Иван&#10;Петрова Мария"></textarea>' +
      '<p style="margin:12px 0 0">Устройств на одну ссылку:</p><div class="chips">' +
      [1, 2, 3].map(function (n) { return '<label class="chip"><input type="radio" name="aMax" value="' + n + '"' + (n === 2 ? ' checked' : '') + '>' + n + '</label>'; }).join('') + '</div>' +
      '<button class="primary" id="aAdd" type="button" disabled>Создать ссылки</button><div id="aNew"></div></section>' +

      '<h2 class="sec-title">Студенты</h2>' +
      '<div class="sbox" style="margin-top:8px"><input type="search" id="aFind" style="padding-left:18px" placeholder="Поиск по фамилии или коду" aria-label="Поиск студента"></div>' +
      '<div class="duo" style="margin-top:4px"><button class="secondary" id="aCopyAll" type="button">Копировать все ссылки</button><button class="secondary" id="aCsv" type="button">Скачать CSV</button></div>' +
      '<div id="aList"></div>' +
      '<p style="margin-top:22px"><button class="linklike" id="aOut" type="button">Выйти из кабинета</button></p>';

    $('aRefresh').addEventListener('click', function () { loadAdmin(pass, true); });
    $('aOut').addEventListener('click', function () { try { sessionStorage.removeItem(ADM_KEY); } catch (e) {} showAdmin(); });
    $('aNames').addEventListener('input', function () { $('aAdd').disabled = !$('aNames').value.trim(); });
    $('aAdd').addEventListener('click', function () {
      var names = $('aNames').value.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
      var mx = +(app.querySelector('input[name=aMax]:checked') || { value: 2 }).value;
      $('aAdd').disabled = true; $('aAdd').textContent = 'Создаём…';
      rpc('admin_add', { p_pass: pass, p_names: names, p_max: mx }).then(function (res) {
        var lines = (res || []).map(function (r) { return r.student + ' — ' + linkFor(r.code); });
        admRows = admRows.concat((res || []).map(function (r) { return { code: r.code, student: r.student, max_devices: mx, active: true, devices: 0, last_seen: null, list: null }; }));
        drawAdmin(pass);
        $('aNew').innerHTML = '<p class="okmsg" style="margin-top:12px">Создано ссылок: ' + lines.length + '</p>' +
          '<textarea class="codebox" readonly id="aNewOut"></textarea><button class="primary" id="aNewCopy" type="button">Скопировать новые ссылки</button>';
        $('aNewOut').value = lines.join('\n');
        $('aNewCopy').addEventListener('click', function () { copyText(lines.join('\n'), $('aNewCopy')); });
        $('aNew').scrollIntoView({ block: 'center' });
      }).catch(function (err) {
        $('aAdd').disabled = false; $('aAdd').textContent = 'Создать ссылки';
        $('aNew').innerHTML = '<p class="errmsg">' + admErr(err) + '</p>';
      });
    });
    $('aFind').value = admFilter;
    $('aFind').addEventListener('input', function () { admFilter = $('aFind').value; drawList(pass); });
    $('aCopyAll').addEventListener('click', function () {
      copyText(admRows.map(function (r) { return r.student + ' — ' + linkFor(r.code); }).join('\n'), $('aCopyAll'));
    });
    $('aCsv').addEventListener('click', function () {
      csvDownload([['Студент', 'Код', 'Ссылка', 'Устройств', 'Лимит', 'Активен', 'Последний вход']].concat(admRows.map(function (r) {
        return [r.student, r.code, linkFor(r.code), r.devices, r.max_devices, r.active ? 'да' : 'нет', r.last_seen ? fmtDate(Date.parse(r.last_seen)) : ''];
      })), 'opermen-students.csv');
    });
    drawList(pass);
  }

  function drawList(pass) {
    var q = norm(admFilter.trim());
    var rows = admRows.filter(function (r) { return !q || norm(r.student).indexOf(q) > -1 || norm(r.code).indexOf(q) > -1; });
    $('aList').innerHTML = rows.length ? rows.map(function (r) {
      var over = +r.devices >= r.max_devices;
      return '<section class="card adm' + (r.active ? '' : ' off') + '" data-code="' + esc(r.code) + '">' +
        '<div class="adm-top"><strong>' + esc(r.student || 'Без имени') + '</strong><span class="' + (over ? 'st-bad' : 'st-ok') + '">' + r.devices + ' из ' + r.max_devices + '</span></div>' +
        '<p class="muted" style="margin:2px 0 0;font-size:15px">Код ' + esc(r.code) + (r.active ? '' : ' · отключён') +
        ' · ' + (r.last_seen ? 'последний вход ' + fmtDate(Date.parse(r.last_seen)) : 'ещё не заходил') + '</p>' +
        (r.list && r.list.length ? '<ul class="devlist">' + r.list.map(function (d) {
          return '<li>' + esc(uaShort(d.ua)) + '<span class="muted"> · с ' + fmtDate(Date.parse(d.first)) + '</span></li>';
        }).join('') + '</ul>' : '') +
        '<div class="adm-acts">' +
        '<button type="button" class="flagbtn" data-act="copy">Копировать ссылку</button>' +
        (+r.devices ? '<button type="button" class="flagbtn" data-act="reset">Сбросить устройства</button>' : '') +
        '<button type="button" class="flagbtn" data-act="toggle">' + (r.active ? 'Отключить' : 'Включить') + '</button>' +
        '<label class="flagbtn" style="gap:6px">Лимит <select data-act="max" aria-label="Лимит устройств">' +
        [1, 2, 3, 4, 5].map(function (n) { return '<option' + (n === r.max_devices ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></label>' +
        '<button type="button" class="flagbtn" data-act="del">Удалить</button>' +
        '</div></section>';
    }).join('') : '<p class="note">' + (admRows.length ? 'Никого не нашли.' : 'Пока нет ни одного студента. Добавьте список выше.') + '</p>';

    Array.prototype.forEach.call($('aList').querySelectorAll('.adm'), function (card) {
      var code = card.getAttribute('data-code');
      card.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('button[data-act]') : null;
        if (!b) return;
        var act = b.getAttribute('data-act');
        if (act === 'copy') { copyText(linkFor(code), b); return; }
        if ((act === 'reset' || act === 'del') && !b.dataset.armed) {
          b.dataset.armed = '1'; b.textContent = act === 'del' ? 'Точно удалить?' : 'Точно сбросить?'; return;
        }
        b.disabled = true;
        var row = admRows.filter(function (r) { return r.code === code; })[0];
        var call = act === 'reset' ? rpc('admin_reset', { p_pass: pass, p_code: code })
          : act === 'del' ? rpc('admin_delete', { p_pass: pass, p_code: code })
          : rpc('admin_update', { p_pass: pass, p_code: code, p_active: !row.active });
        call.then(function () { loadAdmin(pass, true); }).catch(function (err) { b.disabled = false; b.textContent = admErr(err); });
      });
      card.querySelector('select[data-act=max]').addEventListener('change', function (e) {
        var sel = e.target; sel.disabled = true;
        rpc('admin_update', { p_pass: pass, p_code: code, p_max: +sel.value }).then(function () { loadAdmin(pass, true); })
          .catch(function (err) { sel.disabled = false; alert(admErr(err)); });
      });
    });
  }

  /* ---------- Статистика ---------- */
  function showStats() {
    S = null; setBack(true);
    var L = store.last || {};
    var att = ALL.filter(function (c) { return c.uid in L; });
    var gp = att.reduce(function (s, c) { return s + L[c.uid].p; }, 0);
    var gm = att.reduce(function (s, c) { return s + maxPts(c); }, 0);
    var acc = gm ? Math.round(gp / gm * 100) : 0;

    var modsHtml = readyMods().map(function (m) {
      var a = m.cards.filter(function (c) { return c.uid in L; });
      var p = a.reduce(function (s, c) { return s + L[c.uid].p; }, 0), mx = a.reduce(function (s, c) { return s + maxPts(c); }, 0);
      var pc = mx ? Math.round(p / mx * 100) : 0;
      return '<div class="mrow"><div class="top"><span>Модуль ' + m.n + '. ' + m.title + '</span><span>' + (a.length ? pc + '%' : '—') + '</span></div>' +
        '<div class="sub">Пройдено ' + a.length + ' из ' + nTasks(m.cards.length) + '</div>' +
        '<div class="mbar"><i style="width:' + pc + '%"></i></div></div>';
    }).join('');

    var topics = [], byT = {};
    att.forEach(function (c) {
      var k = c.mod.id + '|' + c.topic;
      if (!byT[k]) { byT[k] = { c: c, p: 0, m: 0 }; topics.push(k); }
      byT[k].p += L[c.uid].p; byT[k].m += maxPts(c);
    });
    var weak = topics.map(function (k) { var o = byT[k]; o.pc = Math.round(o.p / o.m * 100); return o; })
      .filter(function (o) { return o.pc < 100; }).sort(function (a, b) { return a.pc - b.pc; }).slice(0, 5);

    var hist = (store.examHist || []).slice(-5).reverse();
    var T = allTerms(), known = (store.flash && store.flash.known) || {};
    var kn = T.filter(function (t) { return known[t.k]; }).length;

    app.innerHTML = mast('Статистика') +
      '<section class="card"><div class="big2"><div><b>' + att.length + '<small style="font-size:22px;color:var(--muted)"> / ' + ALL.length + '</small></b><span>заданий пройдено</span></div>' +
      '<div><b>' + (att.length ? acc + '%' : '—') + '</b><span>точность ответов</span></div></div>' +
      '<div class="big2" style="margin-top:18px"><div><b>' + readiness() + '%</b><span>готовность к экзамену</span></div>' +
      '<div><b>' + streak() + '</b><span>' + plural(streak(), 'день', 'дня', 'дней') + ' подряд с целью ' + goalOf() + '</span></div></div>' +
      '<p class="note">Готовность учитывает все задания курса: сколько вы прошли, насколько верно и насколько давно. Ответы старше недели постепенно весят меньше.</p></section>' +
      '<h2 class="sec-title">По модулям</h2><section class="card" style="margin-top:8px">' + modsHtml + '</section>' +
      '<h2 class="sec-title">Слабые темы</h2><section class="card" style="margin-top:8px">' +
      (weak.length ? '<ul class="parts" style="margin:0">' + weak.map(function (o) {
        return '<li><span>М' + o.c.mod.n + '. ' + o.c.topic + vidHtml(o.c) + '</span><span>' + o.pc + '%</span></li>';
      }).join('') + '</ul>' + (errorUids().length ? '<button class="primary" id="goErr" type="button">Работа над ошибками</button>' : '')
        : '<p style="margin:0">' + (att.length ? 'Слабых тем нет, все пройденные задания решены верно.' : 'Пока нет данных.') + '</p>') +
      '</section>' +
      '<h2 class="sec-title">Экзамены</h2><section class="card" style="margin-top:8px">' +
      (hist.length ? '<ul class="parts" style="margin:0">' + hist.map(function (h) {
        return '<li><span>' + fmtDate(h.at) + ' · ' + h.n + ' вопр.</span><span>' + h.got + ' из ' + h.total + ' · ' + h.pct + '%</span></li>';
      }).join('') + '</ul>' : '<p style="margin:0">Экзаменов ещё не было.</p>') + '</section>' +
      (function () {
        var withNotes = ALL.filter(function (c) { return noteOf(c.uid); });
        if (!withNotes.length) return '';
        return '<h2 class="sec-title">Мои заметки</h2><section class="card notelist" style="margin-top:8px">' + withNotes.map(function (c) {
          return '<div class="rev"><p class="tm st-ok" style="margin:0;color:var(--accent)">Модуль ' + c.mod.n + ' · ' + KIND_NAME[c.kind] + '</p><h3>' + c.q + '</h3><p>' + esc(noteOf(c.uid)) + '</p></div>';
        }).join('') + '</section>';
      })() +
      (T.length ? '<h2 class="sec-title">Карточки</h2><section class="card" style="margin-top:8px"><p style="margin:0">Знаю ' + kn + ' из ' + T.length + ' терминов</p></section>' : '') +
      '<p class="note">Статистика учитывает последний ответ на каждое задание в любом режиме. Данные хранятся на этом устройстве.</p>' +
      '<p><button class="linklike" id="stReset" type="button">Сбросить статистику</button></p>';
    if ($('goErr')) $('goErr').addEventListener('click', startErrors);
    var armed = false;
    $('stReset').addEventListener('click', function () {
      if (!armed) { armed = true; $('stReset').textContent = 'Сбросить статистику и историю экзаменов? Нажмите ещё раз'; return; }
      store.last = {}; store.examHist = []; store.errors = { results: {}, finished: false, order: [] }; save(); showStats();
    });
  }

  /* ---------- Свой набор ---------- */
  function topicKey(c) { return c.mod.id + '|' + c.topic; }
  function showPicker() {
    S = null; setBack(true);
    var pick = store.customPick || {};
    var types = pick.types || ['test', 'match', 'case', 'branch'];
    var chosen = {};
    (pick.topics || ALL.map(topicKey)).forEach(function (t) { chosen[t] = true; });
    var shuf = !!pick.shuffle;

    var cs = customSession(), cst = stOf('custom');
    var canResume = cs.cards.length && !cst.finished && doneCount(cs) > 0 && doneCount(cs) < cs.cards.length;

    var html = mast('Свой набор') +
      (canResume ? '<button class="secondary" id="resume" type="button" style="margin-top:0">Продолжить текущий набор · ' + doneCount(cs) + ' из ' + cs.cards.length + '</button>' : '') +
      '<p class="lead" style="margin-top:14px">Отметьте модули и темы, которые хотите потренировать.</p>' +
      '<h2 class="sec-title">Тип заданий</h2><div class="chips">' +
      ['test', 'match', 'case', 'branch'].map(function (k) {
        return '<label class="chip"><input type="checkbox" name="ty" value="' + k + '"' + (types.indexOf(k) > -1 ? ' checked' : '') + '>' + KIND_NAME[k] + '</label>';
      }).join('') + '</div>' +
      '<h2 class="sec-title">Модули и темы</h2>';

    modules.forEach(function (m) {
      html += '<div class="grp">';
      if (!m.cards) {
        html += '<label class="check master"><input type="checkbox" disabled><span class="t">Модуль ' + m.n + '. ' + m.title + '</span></label><p class="soon" style="margin:-6px 0 4px 36px">Скоро</p></div>';
        return;
      }
      var topics = [], byT = {};
      m.cards.forEach(function (c) { var t = topicKey(c); if (!byT[t]) { byT[t] = []; topics.push(t); } byT[t].push(c); });
      html += '<label class="check master"><input type="checkbox" data-mod="' + m.id + '"><span class="t">Модуль ' + m.n + '. ' + m.title + '</span></label>';
      topics.forEach(function (t) {
        var list = byT[t];
        html += '<label class="check sub"><input type="checkbox" data-topic="' + t.replace(/"/g, '&quot;') + '" data-of="' + m.id + '"' + (chosen[t] ? ' checked' : '') + '>' +
          '<span class="t">' + list[0].topic + '</span><span class="cnt" data-cnt="' + t.replace(/"/g, '&quot;') + '"></span></label>';
      });
      html += '</div>';
    });

    html += '<label class="check" style="margin-top:18px"><input type="checkbox" id="shuf"' + (shuf ? ' checked' : '') + '><span class="t">Перемешать задания</span></label>' +
      '<div class="startbar"><p class="selcount" id="selcount" aria-live="polite"></p>' +
      '<button class="primary" id="startPick" type="button">Начать</button></div>';
    app.innerHTML = html;

    var tyBoxes = Array.prototype.slice.call(app.querySelectorAll('input[name=ty]'));
    var topicBoxes = Array.prototype.slice.call(app.querySelectorAll('input[data-topic]'));
    var modBoxes = Array.prototype.slice.call(app.querySelectorAll('input[data-mod]'));

    function curTypes() { return tyBoxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; }); }
    function curTopics() { return topicBoxes.filter(function (b) { return b.checked; }).map(function (b) { return b.getAttribute('data-topic'); }); }
    function selection() {
      var ty = curTypes(), tp = {};
      curTopics().forEach(function (t) { tp[t] = true; });
      return ALL.filter(function (c) { return tp[topicKey(c)] && ty.indexOf(c.kind) > -1; });
    }
    function persist() {
      store.customPick = { types: curTypes(), topics: curTopics(), shuffle: $('shuf').checked };
      save();
    }
    function refresh() {
      var ty = curTypes();
      modBoxes.forEach(function (mb) {
        var subs = topicBoxes.filter(function (b) { return b.getAttribute('data-of') === mb.getAttribute('data-mod'); });
        var on = subs.filter(function (b) { return b.checked; }).length;
        mb.checked = on === subs.length && on > 0;
        mb.indeterminate = on > 0 && on < subs.length;
      });
      Array.prototype.forEach.call(app.querySelectorAll('[data-cnt]'), function (el) {
        var t = el.getAttribute('data-cnt');
        var n = ALL.filter(function (c) { return topicKey(c) === t && ty.indexOf(c.kind) > -1; }).length;
        el.textContent = n ? nTasks(n) : 'нет';
        el.parentNode.style.opacity = n ? '' : '.55';
      });
      var n = selection().length;
      $('selcount').textContent = n ? 'Выбрано: ' + nTasks(n) : 'Ничего не выбрано';
      $('startPick').disabled = !n;
    }

    tyBoxes.concat(topicBoxes).forEach(function (b) { b.addEventListener('change', function () { refresh(); persist(); }); });
    modBoxes.forEach(function (mb) {
      mb.addEventListener('change', function () {
        topicBoxes.forEach(function (b) { if (b.getAttribute('data-of') === mb.getAttribute('data-mod')) b.checked = mb.checked; });
        refresh(); persist();
      });
    });
    $('shuf').addEventListener('change', persist);
    if ($('resume')) $('resume').addEventListener('click', function () { openSession(customSession()); });
    $('startPick').addEventListener('click', function () {
      persist();
      var order = selection().map(function (c) { return c.uid; });
      if ($('shuf').checked) shuffle(order);
      store.custom = { results: {}, finished: false, order: order };
      save();
      openSession(customSession());
    });
    refresh();
  }

  function render() {
    if (!S) { showMenu(); return; }
    setBack(true);
    var i = currentIndex();
    if (i === -1) { showResult(); return; }
    if (state.finished) { state.finished = false; save(); }
    var c = cards[i];
    if (c.kind === 'test') showTest(c, i);
    else if (c.kind === 'match') showMatch(c, i);
    else if (c.kind === 'branch') showBranch(c, i);
    else showCase(c, i);
  }

  load();
  boot();
})();
</script>
</body>
</html>
